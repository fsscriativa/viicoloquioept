<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Player - Google Drive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .disc-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #06b6d4, #3b82f6, #8b5cf6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .disc-icon.playing {
      animation-play-state: running;
    }

    .disc-icon::after {
      content: '';
      width: 36px;
      height: 36px;
      background: #0f172a;
      border: 4px solid #1e293b;
      border-radius: 50%;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .playlist-container {
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      text-align: left;
    }

    .playlist-container::-webkit-scrollbar {
      width: 6px;
    }

    .playlist-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .playlist-item {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
      color: #cbd5e1;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .playlist-item.active {
      background: rgba(6, 182, 212, 0.2);
      color: #38bdf8;
      font-weight: 600;
      border-color: rgba(6, 182, 212, 0.4);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="disc-icon" id="discIcon"></div>
    <div class="song-title" id="songTitle">Carregando lista...</div>
    <div class="status-text" id="statusText">Aguardando dados...</div>

    <audio id="audioPlayer" controls></audio>

    <div class="playlist-container" id="playlistContainer"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyEQ7LnM-WrHMcAvY754g4wRRQrbu25Fu5apbvmV9OciHCSvqjHcfm6Afy5oJdY9m7_cA/exec';

    let playlist = [];
    let currentIndex = 0;

    const audioPlayer = document.getElementById('audioPlayer');
    const songTitle = document.getElementById('songTitle');
    const statusText = document.getElementById('statusText');
    const playlistContainer = document.getElementById('playlistContainer');
    const discIcon = document.getElementById('discIcon');

    async function loadPlaylist() {
      try {
        statusText.textContent = 'Conectando ao Apps Script...';
        const response = await fetch(API_URL);
        playlist = await response.json();

        console.log("Playlist recebida:", playlist);

        if (!Array.isArray(playlist) || playlist.length === 0) {
          songTitle.textContent = 'Pasta vazia';
          statusText.textContent = 'Nenhum arquivo encontrado.';
          return;
        }

        renderPlaylist();
        setTrack(0, false);
        statusText.textContent = `${playlist.length} músicas carregadas.`;
      } catch (error) {
        songTitle.textContent = 'Erro ao carregar';
        statusText.textContent = 'Verifique o Console (F12).';
        console.error("Erro no fetch:", error);
      }
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        item.textContent = `${index + 1}. ${track.title}`;
        item.onclick = () => {
          setTrack(index, true);
        };
        playlistContainer.appendChild(item);
      });
    }

    function setTrack(index, autoPlay = false) {
      if (index < 0 || index >= playlist.length) return;
      
      currentIndex = index;
      const track = playlist[currentIndex];
      
      songTitle.textContent = track.title;
      statusText.textContent = `Faixa ${currentIndex + 1} de ${playlist.length}`;
      audioPlayer.src = track.url;
      audioPlayer.load(); // Força o elemento de áudio a recarregar a nova fonte

      renderPlaylist();

      if (autoPlay) {
        audioPlayer.play().catch(err => {
          console.warn("Autoplay bloqueado/Erro ao tocar:", err);
          statusText.textContent = 'Clique no play do player para iniciar.';
        });
      }
    }

    audioPlayer.onended = () => {
      let nextIndex = currentIndex + 1;
      if (nextIndex >= playlist.length) nextIndex = 0;
      setTrack(nextIndex, true);
    };

    audioPlayer.onerror = (e) => {
      console.error("Erro no elemento de áudio:", audioPlayer.error);
      statusText.textContent = 'Erro ao reproduzir o arquivo de áudio.';
    };

    audioPlayer.onplay = () => discIcon.classList.add('playing');
    audioPlayer.onpause = () => discIcon.classList.remove('playing');

    window.onload = loadPlaylist;
  </script>
</body>
</html>
