<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VII Colóquio EPT — Painel Administrativo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & BASE (DARK THEME ADMIN)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(90deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .user-badge {
      font-size: 0.85rem;
      color: #7ee787;
      background: rgba(46, 160, 67, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #2ea043;
    }

    /* TELA DE LOGIN */
    .login-container {
      max-width: 400px;
      margin: 60px auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
    }

    .login-container h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .login-container p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 6px;
    }

    input[type="email"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      color: #f0f6fc;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: #58a6ff;
    }

    /* FILTROS E CONTEÚDO ADMIN */
    .admin-content {
      display: none;
    }

    .filters-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .filter-btn {
      background: #161b22;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: #21262d;
      color: #58a6ff;
      border-color: #58a6ff;
    }

    /* LISTA DE CARDS PARA MODERAÇÃO */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-card .meta {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .item-card .autor {
      font-weight: 700;
      color: #58a6ff;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .item-card .body-content {
      font-size: 0.9rem;
      color: #c9d1d9;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .item-card img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* BOTÕES DE AÇÃO */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-approve { background: #238636; color: #fff; }
    .btn-reject { background: #da3633; color: #fff; }

    /* TAGS DE STATUS */
    .status-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-PENDENTE { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid #d29922; }
    .status-APROVADA { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; }
    .status-REJEITADA { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="screen-login" class="login-container">
    <h2>🔐 Acesso Restrito</h2>
    <p>Digite seu e-mail cadastrado na comissão organizadora.</p>
    <form onsubmit="autenticar(event)">
      <div class="form-group">
        <label for="admin-email">E-mail Corporativo/Autorizado</label>
        <input type="email" id="admin-email" required placeholder="seu.email@instituto.edu.br">
      </div>
      <button type="submit" class="btn btn-approve" style="width: 100%;">ENTRAR NO PAINEL</button>
    </form>
    <div id="login-error" style="color: #f85149; font-size: 0.85rem; margin-top: 12px; display: none;"></div>
  </div>

  <!-- PAINEL ADMINISTRATIVO -->
  <div id="screen-admin" class="admin-content">
    
    <header>
      <h1>Moderação VI Colóquio</h1>
      <span class="user-badge" id="logged-user-display"></span>
    </header>

    <!-- NAVEGAÇÃO DE FILTROS -->
    <div class="filters-nav">
      <button class="filter-btn active" onclick="filtrarCategoria('TODOS')">📋 Todos</button>
      <button class="filter-btn" onclick="filtrarCategoria('MUSICAS')">🎵 Músicas</button>
      <button class="filter-btn" onclick="filtrarCategoria('FOTOS')">📸 Fotos</button>
      <button class="filter-btn" onclick="filtrarCategoria('PESQUISAS')">🔬 Pesquisas</button>
      <button class="filter-btn" onclick="carregarDadosAdmin()" style="margin-left: auto;">🔄 Atualizar</button>
    </div>

    <!-- GRID DE ITENS -->
    <div class="items-grid" id="items-grid">
      <!-- Inserido dinamicamente via JS -->
    </div>

  </div>

  <script>
    /* ==========================================================================
       CONFIGURAÇÕES E ESTADO
       ========================================================================== */
    const API_URL = 'https://script.google.com/macros/s/AKfycbyS-IJNgpC302fN2l90JKbjswEEH7sxfJzntkYM38ZVz4q6WjZHTDPLvQcoq7GGJ7LL/exec';
    
    let adminEmail = localStorage.getItem('admin_email') || '';
    let dadosGlobais = { musicas: [], fotos: [], pesquisas: [] };
    let categoriaAtual = 'TODOS';

    // Auto-login se e-mail estiver gravado
    if (adminEmail) {
      iniciarSessao();
    }

    /* ==========================================================================
       AUTENTICAÇÃO & SESSÃO
       ========================================================================== */
    async function autenticar(e) {
      e.preventDefault();
      const inputEmail = document.getElementById('admin-email').value.trim();
      const errEl = document.getElementById('login-error');
      
      errEl.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}?action=getAdminData&email=${encodeURIComponent(inputEmail)}`);
        const json = await response.json();

        if (json.status === 'success') {
          adminEmail = inputEmail;
          localStorage.setItem('admin_email', adminEmail);
          dadosGlobais = json.data;
          iniciarSessao();
        } else {
          errEl.innerText = '❌ E-mail não autorizado para a comissão.';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.innerText = '❌ Erro ao conectar com o servidor.';
        errEl.style.display = 'block';
      }
    }

    function iniciarSessao() {
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-admin').style.display = 'block';
      document.getElementById('logged-user-display').innerText = `👤 ${adminEmail}`;
      carregarDadosAdmin();
    }

    /* ==========================================================================
       CARREGAMENTO DE DADOS
       ========================================================================== */
    async function carregarDadosAdmin() {
      const container = document.getElementById('items-grid');
      container.innerHTML = '<div class="empty-state">Carregando conteúdos...</div>';

      try {
        const response = await fetch(`${API_URL}?action=getAdminData&email=${encodeURIComponent(adminEmail)}`);
        const json = await response.json();

        if (json.status === 'success') {
          dadosGlobais = json.data;
          renderizarItens();
        }
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Erro ao atualizar dados.</div>';
      }
    }

    function filtrarCategoria(cat) {
      categoriaAtual = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderizarItens();
    }

    /* ==========================================================================
       RENDERIZAÇÃO DOS CARDS
       ========================================================================== */
    function renderizarItens() {
      const container = document.getElementById('items-grid');
      container.innerHTML = '';

      let listaUnificada = [];

      if (categoriaAtual === 'TODOS' || categoriaAtual === 'MUSICAS') {
        dadosGlobais.musicas.forEach(m => listaUnificada.push({ ...m, TIPO: 'MUSICAS', icon: '🎵' }));
      }
      if (categoriaAtual === 'TODOS' || categoriaAtual === 'FOTOS') {
        dadosGlobais.fotos.forEach(f => listaUnificada.push({ ...f, TIPO: 'FOTOS', icon: '📸' }));
      }
      if (categoriaAtual === 'TODOS' || categoriaAtual === 'PESQUISAS') {
        dadosGlobais.pesquisas.forEach(p => listaUnificada.push({ ...p, TIPO: 'PESQUISAS', icon: '🔬' }));
      }

      // Ordenar: PENDENTES primeiro, depois por data recente
      listaUnificada.sort((a, b) => {
        if (a.STATUS === 'PENDENTE' && b.STATUS !== 'PENDENTE') return -1;
        if (a.STATUS !== 'PENDENTE' && b.STATUS === 'PENDENTE') return 1;
        return new Date(b.DATA) - new Date(a.DATA);
      });

      if (listaUnificada.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhum item encontrado nesta categoria.</div>';
        return;
      }

      listaUnificada.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';

        let corpoHtml = '';
        if (item.TIPO === 'MUSICAS') {
          corpoHtml = `<div class="body-content"><strong>Música:</strong> <a href="${escapeHtml(item.URL)}" target="_blank" style="color:#58a6ff;">Ver no YouTube 🔗</a></div>`;
        } else if (item.TIPO === 'FOTOS') {
          const driveUrl = `https://lh3.googleusercontent.com/d/${item.FILE_ID}=s400`;
          corpoHtml = `
            <img src="${driveUrl}" alt="Foto enviada">
            <div class="body-content">${escapeHtml(item.MENSAGEM || 'Sem mensagem')}</div>
          `;
        } else if (item.TIPO === 'PESQUISAS') {
          corpoHtml = `<div class="body-content">"${escapeHtml(item.PESQUISA)}"</div>`;
        }

        card.innerHTML = `
          <div>
            <div class="meta">
              <span>${item.icon} ${item.TIPO}</span>
              <span class="status-tag status-${item.STATUS}">${item.STATUS}</span>
            </div>
            <div class="autor">${escapeHtml(item.NOME)}</div>
            ${corpoHtml}
          </div>
          <div class="actions">
            <button class="btn btn-approve" onclick="moderar('${item.TIPO}', '${item.ID}', 'APROVADA')">✓ APROVAR</button>
            <button class="btn btn-reject" onclick="moderar('${item.TIPO}', '${item.ID}', 'REJEITADA')">✕ REJEITAR</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    /* ==========================================================================
       MODERAÇÃO DE ITENS (POST)
       ========================================================================== */
    async function moderar(tipo, id, novoStatus) {
      const payload = {
        action: 'moderarItem',
        adminEmail: adminEmail,
        tipo: tipo,
        id: id,
        novoStatus: novoStatus
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const json = await response.json();

        if (json.status === 'success') {
          // Atualiza o estado local imediatamente
          const aba = tipo.toLowerCase();
          const item = dadosGlobais[aba].find(i => i.ID === id);
          if (item) item.STATUS = novoStatus;
          renderizarItens();
        } else {
          alert(`Erro: ${json.message}`);
        }
      } catch (err) {
        alert('Erro de conexão ao moderar item.');
      }
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
