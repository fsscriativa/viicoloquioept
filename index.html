<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RÁDIO EPT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #215912, #0f2c08);
      color: #F2F2F2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .radio-header {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #F2F2F2;
      margin-bottom: 24px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .player-card {
      background: rgba(33, 89, 18, 0.35);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(70, 191, 36, 0.25);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .disc-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #46BF24, #348C1C, #2B7317, #215912, #46BF24);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(70, 191, 36, 0.4);
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .disc-icon.playing {
      animation-play-state: running;
    }

    .disc-icon::after {
      content: '';
      width: 36px;
      height: 36px;
      background: #14350b;
      border: 4px solid #2B7317;
      border-radius: 50%;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #F2F2F2;
    }

    .status-text {
      font-size: 0.85rem;
      color: #c8e6c9;
      margin-bottom: 16px;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 12px;
      margin-bottom: 20px;
      accent-color: #46BF24;
    }

    .playlist-container {
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid rgba(242, 242, 242, 0.15);
      padding-top: 16px;
      text-align: left;
    }

    .playlist-container::-webkit-scrollbar {
      width: 6px;
    }

    .playlist-container::-webkit-scrollbar-thumb {
      background: rgba(70, 191, 36, 0.3);
      border-radius: 4px;
    }

    .playlist-item {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
      color: #d1e7dd;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      background: rgba(33, 89, 18, 0.2);
      border: 1px solid rgba(70, 191, 36, 0.1);
    }

    .playlist-item:hover {
      background: rgba(52, 140, 28, 0.4);
      color: #F2F2F2;
    }

    .playlist-item.active {
      background: rgba(70, 191, 36, 0.25);
      color: #46BF24;
      font-weight: 600;
      border-color: rgba(70, 191, 36, 0.5);
    }
  </style>
</head>
<body>

  <div class="radio-header">RÁDIO EPT</div>

  <div class="player-card">
    <div class="disc-icon" id="discIcon"></div>
    <div class="song-title" id="songTitle">Buscando músicas...</div>
    <div class="status-text" id="statusText">Lendo a pasta automaticamente</div>

    <audio id="audioPlayer" controls></audio>

    <div class="playlist-container" id="playlistContainer"></div>
  </div>

  <script>
    const GITHUB_USER = 'fsscriativa';
    const GITHUB_REPO = 'viicoloquioept';
    const FOLDER_NAME = 'musicas';

    let playlist = [];
    let currentIndex = 0;

    const audioPlayer = document.getElementById('audioPlayer');
    const songTitle = document.getElementById('songTitle');
    const statusText = document.getElementById('statusText');
    const playlistContainer = document.getElementById('playlistContainer');
    const discIcon = document.getElementById('discIcon');

    async function fetchGitHubFolder() {
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_NAME}`;
        const response = await fetch(apiUrl);
        const files = await response.json();

        if (!Array.isArray(files)) {
          throw new Error('A resposta da API do GitHub não retornou uma lista.');
        }

        playlist = files
          .filter(file => file.name.toLowerCase().endsWith('.mp3'))
          .map(file => ({
            title: file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " "),
            url: file.download_url
          }));

        if (playlist.length === 0) {
          songTitle.textContent = 'Pasta vazia';
          statusText.textContent = 'Nenhum arquivo .mp3 encontrado na pasta /musicas.';
          return;
        }

        renderPlaylist();
        setTrack(0, false);
        statusText.textContent = `${playlist.length} músicas carregadas automaticamente.`;
      } catch (error) {
        songTitle.textContent = 'Erro ao ler pasta';
        statusText.textContent = 'Verifique se a pasta "musicas" existe na raiz.';
        console.error(error);
      }
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        item.textContent = `${index + 1}. ${track.title}`;
        item.onclick = () => setTrack(index, true);
        playlistContainer.appendChild(item);
      });
    }

    function setTrack(index, autoPlay = false) {
      if (index < 0 || index >= playlist.length) return;
      
      currentIndex = index;
      const track = playlist[currentIndex];
      
      songTitle.textContent = track.title;
      statusText.textContent = `Faixa ${currentIndex + 1} de ${playlist.length}`;
      audioPlayer.src = track.url;
      audioPlayer.load();

      renderPlaylist();

      if (autoPlay) {
        audioPlayer.play().catch(err => {
          console.warn("Autoplay bloqueado pelo navegador:", err);
          statusText.textContent = 'Clique no play do player para iniciar.';
        });
      }
    }

    audioPlayer.onended = () => {
      let nextIndex = currentIndex + 1;
      if (nextIndex >= playlist.length) nextIndex = 0;
      setTrack(nextIndex, true);
    };

    audioPlayer.onplay = () => discIcon.classList.add('playing');
    audioPlayer.onpause = () => discIcon.classList.remove('playing');

    window.onload = fetchGitHubFolder;
  </script>
</body>
</html>
